name: bar-archive
# Nightly archive of 1-minute bars (NQ, ES, RTY, YM, GC, CL) so every new day becomes unseen test data.
on:
  schedule:
    - cron: "15 23 * * 1-5"      # after the futures daily break
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: python tools/bar_archive.py
      - if: always()
        run: bash .github/actions_common.sh "bar archive"
