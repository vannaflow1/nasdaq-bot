name: nerd-live
on:
  schedule:
    - cron: "5,35 13-20 * * 1-5"     # every 30 min through the US session (both summer and winter time)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: |
          set -o pipefail
          python nasdaq_bot.py --nerdlive 2>&1 | tail -30 > nerd_live.log
        env:
          PYTHONUNBUFFERED: "1"
      - if: always()
        run: bash .github/actions_common.sh "nerd-live"
