name: prop-search
on:
  schedule:
    - cron: "17 */3 * * *"    # every 3 hours = back to back (a run takes ~2h50); the concurrency group queues overlaps
  workflow_dispatch:
    inputs:
      minutes: { description: "search minutes", required: false, default: "155" }
permissions:
  contents: write
concurrency:
  group: prop-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]     # 8 parallel jobs, each walks its own eighth of the grid (already-tested specs are skipped via all results)
        track: [classic]
        include:                            # new-regime track (edges that may only exist since 2024): 2 extra jobs
          - { shard: 0, track: recent }
          - { shard: 1, track: recent }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt scipy
      - run: python prop_search.py
        env:
          SEARCH_MINUTES: ${{ github.event.inputs.minutes || '155' }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.track == 'recent' && '2' || '8' }}
          TRACK: ${{ matrix.track }}
          PORTFOLIO_MINUTES: ${{ matrix.track == 'recent' && '0' || '10' }}
          PYTHONUNBUFFERED: "1"
      - if: always()
        run: |
          for i in 1 2 3 4 5; do bash .github/actions_common.sh "prop search ${{ matrix.track }} ${{ matrix.shard }}" && break; sleep $((RANDOM % 20 + 5)); done
