name: prop-search
on:
  schedule:
    - cron: "17 */3 * * *"    # every 3 hours = back to back (a run takes ~2h50); the concurrency group queues overlaps
  workflow_dispatch:
    inputs:
      minutes: { description: "search minutes", required: false, default: "155" }
permissions:
  contents: write
concurrency:
  group: prop-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]                       # expert review 2: cut from 8 to 2 after the first edge-first pass (0/15.6k beat the bar);
        track: [classic]                    # the new-regime track is paused (near-zero power for edges this size)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt scipy
      - run: python prop_search.py
        env:
          SEARCH_MINUTES: ${{ github.event.inputs.minutes || '155' }}
          SHARD: ${{ matrix.shard }}
          SHARDS: "2"
          TRACK: ${{ matrix.track }}
          PORTFOLIO_MINUTES: "0"              # off since 21 Oct 2026 (expert review: it optimised prop EV on the search years)
          SEARCH_MARKETS: "NQ"                # GC/CL only through families with a market-specific mechanism
          PYTHONUNBUFFERED: "1"
      - if: always()
        run: |
          for i in 1 2 3 4 5; do bash .github/actions_common.sh "prop search ${{ matrix.track }} ${{ matrix.shard }}" && break; sleep $((RANDOM % 20 + 5)); done
