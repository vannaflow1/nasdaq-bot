name: research
on:
  workflow_dispatch:
    inputs:
      script: { description: "tools/<script>.py", required: true }
permissions:
  contents: write
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt scipy
      - run: python "tools/${{ github.event.inputs.script }}.py" 2>&1 | tail -60 || true
      - if: always()
        run: bash .github/actions_common.sh "research ${{ github.event.inputs.script }}"
