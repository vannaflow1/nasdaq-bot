name: families
# Scores newly registered mechanism families (families.py) and refreshes the power curve (power.py).
on:
  push:
    branches: [main]
    paths: ["knowledge/families.json"]
  schedule:
    - cron: "30 4 * * 0"         # Sundays: power curve (20 null worlds)
    - cron: "30 5 * * 1"         # Mondays: families waiting for an exam slot (new exam week)
    - cron: "40 6 * * 2-6"       # daily (after each US session): v2 forward route - sealed window + new days, group-sequential
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: families
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt scipy
      - uses: actions/cache@v4               # proxy days (outside the repo, never committed) - fetched once, reused
        with:
          path: ~/.proxy_cache
          key: proxy-v1-${{ github.run_id }}
          restore-keys: proxy-v1-
      - run: python tools/ledger_check.py       # fails loudly if a must-only-grow ledger was rewritten
      - run: python families.py --reps 100
        env: { PYTHONUNBUFFERED: "1" }
      - if: github.event.schedule == '30 4 * * 0'
        run: python power.py --family F10 --worlds 400        # null v3 (shared draws): cheap, so many more worlds
        env: { PYTHONUNBUFFERED: "1" }
      - run: python eval_decision.py || true                   # frozen eval rule: E[EV] vs the zero-edge account (curves weekly)
        env: { PYTHONUNBUFFERED: "1" }
      - if: always()
        run: for i in 1 2 3 4 5; do bash .github/actions_common.sh "families" && break; sleep $((RANDOM % 20 + 5)); done
