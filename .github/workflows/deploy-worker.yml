name: deploy-worker
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare secrets
        id: chk
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then echo "ok=1" >> $GITHUB_OUTPUT; else echo "Cloudflare secrets not set - skipping deploy" | tee deploy_worker.log; fi
      - if: steps.chk.outputs.ok == '1'
        name: Derive private learning key
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          K=$(printf '%s' "$T-volta-learn" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$K"; echo "LEARN_KEY=$K" >> $GITHUB_ENV
      - if: steps.chk.outputs.ok == '1'
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            LEARN_KEY
      - if: always() && steps.chk.outputs.ok == '1'
        env:
          OUT: ${{ steps.wr.outputs.command-output }}
          URL: ${{ steps.wr.outputs.deployment-url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          { echo "== $(date -u)"; echo "$OUT" | grep -v -i -E "token|workers.dev";
            [ -n "$URL" ] && echo "health check -> $(curl -s -m 20 "$URL")";
            echo "== workers on this account:";
            curl -s -m 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | python3 -c "import sys,json; d=json.load(sys.stdin); print([s.get('id') for s in d.get('result') or []], d.get('errors'))";
          } > deploy_worker.log 2>&1; cat deploy_worker.log
      - if: always()
        run: |
          git config user.name "nasdaq-bot"; git config user.email "nasdaq-bot@users.noreply.github.com"
          git add deploy_worker.log || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "state: deploy-worker"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i*5)); done
