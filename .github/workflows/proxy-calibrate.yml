name: proxy-calibrate
# Checks the free Dukascopy CFD proxy against Volta's own futures data on months it has ALREADY seen (tools/dukascopy.py).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: proxy
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt scipy
      - uses: actions/cache@v4               # proxy days (outside the repo, never committed) - fetched once, reused
        with:
          path: ~/.proxy_cache
          key: proxy-v1-${{ github.run_id }}
          restore-keys: proxy-v1-
      - run: |                                   # logs go into the repo (Actions logs are not readable from Claude's sandbox)
          mkdir -p knowledge/research_out
          python tools/dukascopy.py probe > knowledge/research_out/proxy_probe.txt 2>&1 || true
          python tools/dukascopy.py calibrate > knowledge/research_out/proxy_calibrate_log.txt 2>&1 || true
          tail -c 3000 knowledge/research_out/proxy_calibrate_log.txt
        env: { PYTHONUNBUFFERED: "1" }
      - if: always()
        run: for i in 1 2 3 4 5; do bash .github/actions_common.sh "proxy-calibrate" && break; sleep $((RANDOM % 20 + 5)); done
