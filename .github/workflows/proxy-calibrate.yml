name: proxy-calibrate
# Checks the free Dukascopy CFD proxy against Volta's own futures data on months it has ALREADY seen (tools/dukascopy.py).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: proxy
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt scipy
      - run: python tools/dukascopy.py probe
      - run: python tools/dukascopy.py calibrate
        env: { PYTHONUNBUFFERED: "1" }
      - if: always()
        run: for i in 1 2 3 4 5; do bash .github/actions_common.sh "proxy-calibrate" && break; sleep $((RANDOM % 20 + 5)); done
